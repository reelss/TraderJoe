# Joe — Daily Digest
#
# Runs at 4:30pm ET (after the market close) on weekdays.
# EDT = UTC-4 (summer) → 20:30 UTC.
# EST = UTC-5 (winter) → 21:30 UTC. This file targets 20:30 UTC (EDT/summer).
# Adjust the cron to 21:30 UTC in the November–March window if desired.
#
# What it does:
#   - Reads today's trades and decisions from the log files.
#   - Calls Claude Haiku for a personality-rich narrative summary.
#   - Posts the full digest to Slack (if SLACK_WEBHOOK_URL is set).
#   - Rebuilds dashboard.html and pushes it to GitHub Pages.
#
# Entry point: python -m agent.main digest
# Docs: agent/digest.py

name: Joe — Daily Digest

on:
  # 4:30pm ET year-round. Use 20:30 UTC for EDT (UTC-4, June–November).
  # To run 4:30pm EST (December–March, UTC-5): change cron to "30 21 * * 1-5".
  schedule:
    - cron: "30 20 * * 1-5"  # 4:30pm EDT (20:30 UTC)

  # Allow manual trigger from the GitHub Actions UI (useful for testing).
  workflow_dispatch:

permissions:
  contents: write  # needed for dashboard publish to gh-pages via publish.py

jobs:
  digest:
    name: Daily digest
    runs-on: ubuntu-latest

    env:
      # Required credentials — set these in GitHub repo Settings → Secrets → Actions
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Optional sources — leave unset in GitHub Secrets if not using them.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # publish.py pushes dashboard to GitHub Pages via git.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opt into Node.js 24 for actions (becomes default 2026-06-16).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python (latest stable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for dashboard publish
        # publish.py pushes to GitHub Pages via subprocess git.
        # Wire the GITHUB_TOKEN into the credential helper so it authenticates.
        run: |
          git config --global user.name "reelss"
          git config --global user.email "reelss@gmail.com"
          git config --global credential.helper store
          echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials

      - name: Run daily digest
        run: python -m agent.main digest
