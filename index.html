<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>Joe · Trading Dashboard</title>
<style>
  :root{
    --bg:#020617; --panel:#0b1220; --panel2:#111c30; --line:#1e293b;
    --text:#f8fafc; --muted:#94a3b8; --pos:#22c55e; --neg:#f43f5e;
    --accent:#38bdf8;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Fira Code",Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1200px 600px at 80% -10%,rgba(56,189,248,.08),transparent),
      var(--bg);color:var(--text);font-family:var(--sans);
      -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 64px}
  header{display:flex;align-items:flex-end;justify-content:space-between;
      gap:16px;flex-wrap:wrap;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{font-size:38px;line-height:1;filter:drop-shadow(0 0 14px rgba(56,189,248,.35))}
  h1{font-family:var(--mono);font-size:30px;margin:0;letter-spacing:-.5px;
      text-shadow:0 0 18px rgba(248,250,252,.12)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .updated{color:var(--muted);font-size:12px;font-family:var(--mono);text-align:right}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      margin-bottom:22px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .kpi .label{color:var(--muted);font-size:11px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:8px}
  .kpi .value{font-family:var(--mono);font-size:24px;font-weight:600}
  .kpi .delta{font-family:var(--mono);font-size:13px;margin-top:4px}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
  .panel{background:linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}
  .panel h2{font-family:var(--mono);font-size:14px;font-weight:600;margin:0 0 14px;
      color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;
      text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;
      border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid rgba(30,41,59,.5);font-family:var(--mono)}
  tr:last-child td{border-bottom:none}
  .num{text-align:right}
  .badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;
      padding:2px 8px;border-radius:6px}
  .badge.buy{background:rgba(34,197,94,.14);color:var(--pos)}
  .badge.sell{background:rgba(244,63,94,.14);color:var(--neg)}
  .badge.hold{background:rgba(148,163,184,.14);color:var(--muted)}
  .feed{display:flex;flex-direction:column;gap:0}
  .item{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px 0;
      border-bottom:1px solid rgba(30,41,59,.5)}
  .item:last-child{border-bottom:none}
  .item .sym{font-family:var(--mono);font-weight:600}
  .item .rsn{color:var(--muted);font-size:13px}
  .item .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  .chartwrap{position:relative;width:100%}
  .benchrow{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:10px;
      font-size:12px;color:var(--muted)}
  .bkey{display:flex;align-items:center;gap:6px}
  .swatch{width:14px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block}
  .swatch.joe{border:none;height:3px;border-radius:2px}
  .swatch.spy{border-top-color:#94a3b8;border-top-style:dashed}
  .bdiff{margin-left:auto;font-weight:600}
  .bdiff.pos{color:var(--pos)} .bdiff.neg{color:var(--neg)}
  svg{width:100%;height:auto;display:block}
  .axis{fill:var(--muted);font-family:var(--mono);font-size:11px}
  @media(max-width:560px){.kpi .value{font-size:20px}h1{font-size:24px}}
</style>
</head>

const usd = n => (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => (n>=0?'+':'')+n.toFixed(2)+'%';
const sign = n => n>=0?'pos':'neg';
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shortTime = ts => { const d=new Date(ts); return isNaN(d)?'':d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };

  {label:'Win Rate', value:(D.win_rate==null?'—':(D.win_rate*100).toFixed(0)+'%'), delta:'open positions green', cls:'muted'},
];
document.getElementById('kpis').innerHTML = kpis.map(k=>`

    <div class="delta ${k.cls}">${k.delta}</div>
  </div>`).join('');

// ---- Equity curve (inline SVG, Catmull-Rom smoothing) ----
function drawChart(){
  const W=1000,H=300,padL=8,padR=8,padT=18,padB=26;
  let pts = D.curve.map(p=>p.v);
  if(pts.length<2) pts = pts.length? [pts[0],pts[0]] : [D.start_equity,D.start_equity];
  const base = D.start_equity;
  // SPY buy-and-hold overlay — the benchmark that actually matters. Scaled
  // together with Joe so both series share one y-axis.
  const bp = (D.bench||[]).length===pts.length ? D.bench : [];
  let lo=Math.min(base,...pts,...bp), hi=Math.max(base,...pts,...bp);
  if(hi===lo){hi=lo+1;lo=lo-1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const x=i=>padL+(i/(pts.length-1))*(W-padL-padR);
  const y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
  const coords=pts.map((v,i)=>({x:x(i),y:y(v)}));
  // smooth path
  let d='M'+coords[0].x.toFixed(1)+','+coords[0].y.toFixed(1);
  for(let i=0;i<coords.length-1;i++){
    const p0=coords[i-1]||coords[i],p1=coords[i],p2=coords[i+1],p3=coords[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const area=d+` L${coords[coords.length-1].x.toFixed(1)},${(H-padB)} L${coords[0].x.toFixed(1)},${(H-padB)} Z`;
  const up = pts[pts.length-1] >= base;
  const stroke = up? 'var(--pos)':'var(--neg)';
  const baseY=y(base).toFixed(1);

  let benchPath='', benchLabel='', benchCls='muted';
  if(bp.length>1){
    benchPath=bp.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const diff=(pts[pts.length-1]/base-1)*100-(bp[bp.length-1]/base-1)*100;
    benchLabel=`Joe ${diff>=0?'+':''}${diff.toFixed(2)} pts vs S&P 500`;
    benchCls = diff>=0 ? 'pos' : 'neg';
  }
  document.getElementById('chart').innerHTML=`
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Equity curve">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${up?'#22c55e':'#f43f5e'}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${up?'#22c55e':'#f43f5e'}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>
    <text class="axis" x="6" y="${(+baseY-6)}">baseline ${usd(base)}</text>
    <path d="${area}" fill="url(#fill)"/>
    ${benchPath?`<path d="${benchPath}" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="6 5" stroke-linecap="round" opacity="0.85"/>`:''}
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  ${benchLabel?`<div class="benchrow">
    <span class="bkey"><span class="swatch joe" style="background:${up?'var(--pos)':'var(--neg)'}"></span>Joe</span>
    <span class="bkey"><span class="swatch spy"></span>S&amp;P 500 buy &amp; hold</span>
    <span class="bdiff ${benchCls}">${benchLabel}</span>
  </div>`:''}`;
}
drawChart();

    <tbody>${D.positions.map(p=>`<tr>

      <td class="num">${usd(p.current_price)}</td>
      <td class="num">${usd(p.market_value)}</td>
      <td class="num ${sign(p.plpc)}">${usd(p.pl)} <span class="muted">${pct(p.plpc)}</span></td>
    </tr>`).join('')}</tbody></table>`;
})();

// ---- Trades ----
(function(){
  const el=document.getElementById('trades');
  if(!D.trades.length){el.innerHTML='<div class="empty">No trades yet.</div>';return;}
  el.innerHTML=`<table><thead><tr>
    <th>Time</th><th>Side</th><th>Ticker</th><th class="num">Qty</th><th class="num">Price</th><th class="num">P&L</th></tr></thead>
    <tbody>${D.trades.map(t=>{
      const side=(t.side||'').toLowerCase();
      const price=t.fill_price!=null?usd(t.fill_price):'—';
      const pl=t.realized_pl!=null?`<span class="${sign(t.realized_pl)}">${usd(t.realized_pl)}</span>`:'—';
      return `<tr>
        <td class="muted">${shortTime(t.ts)}</td>
        <td><span class="badge ${side}">${side.toUpperCase()}</span></td>
        <td>${esc(t.symbol)}</td>
        <td class="num">${t.fill_qty!=null?t.fill_qty:(t.qty!=null?t.qty:'—')}</td>
        <td class="num">${price}</td>
        <td class="num">${pl}</td>
      </tr>`;}).join('')}</tbody></table>`;
})();

// ---- Decision feed ----
(function(){
  const el=document.getElementById('decisions');
  if(!D.decisions.length){el.innerHTML='<div class="empty">No decisions logged yet.</div>';return;}
  el.innerHTML=D.decisions.map(d=>{
    const a=(d.action||'hold').toLowerCase();
    const conv=d.conviction!=null?(' &middot; conviction '+d.conviction+'/5'):'';
    return `<div class="item">
      <div><span class="badge ${a}">${a.toUpperCase()}</span></div>
      <div>
        <div class="sym">${esc(d.symbol)}</div>
        <div class="rsn">${esc(d.reasoning||'')}</div>
        <div class="meta">${shortTime(d.ts)}${conv}</div>
      </div>
    </div>`;}).join('');
})();
</script>
</body>
</html>
