      color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;
      text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;
      border-bottom:1px solid var(--line)}

  tr:last-child td{border-bottom:none}
  .num{text-align:right}
  .badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;
      padding:2px 8px;border-radius:6px}
  .badge.buy{background:rgba(34,197,94,.14);color:var(--pos)}
  .badge.sell{background:rgba(244,63,94,.14);color:var(--neg)}
  .badge.hold{background:rgba(148,163,184,.14);color:var(--muted)}

  .item{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px 0;
      border-bottom:1px solid rgba(30,41,59,.5)}
  .item:last-child{border-bottom:none}

  .item .rsn{color:var(--muted);font-size:13px}
  .item .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  .chartwrap{position:relative;width:100%}
  svg{width:100%;height:auto;display:block}
  .axis{fill:var(--muted);font-family:var(--mono);font-size:11px}

</style>

const usd = n => (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => (n>=0?'+':'')+n.toFixed(2)+'%';
const sign = n => n>=0?'pos':'neg';
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shortTime = ts => { const d=new Date(ts); return isNaN(d)?'':d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };

// ---- updated stamp ----
document.getElementById('updated').textContent = 'Updated ' + shortTime(D.generated);

// ---- KPIs ----
const kpis = [
  {label:'Total Return', value:usd(D.total_pl), delta:pct(D.total_pct*100), cls:sign(D.total_pl)},
  {label:'Equity', value:usd(D.equity), delta:'from '+usd(D.start_equity), cls:'muted'},
  {label:"Day P&L", value:usd(D.day_pl), delta:pct(D.day_pct*100), cls:sign(D.day_pl)},
  {label:'Cash', value:usd(D.cash), delta:(D.open_count+' positions'), cls:'muted'},
  {label:'Open Positions', value:String(D.open_count), delta:(D.winners+' in profit'), cls:'muted'},
  {label:'Win Rate', value:(D.win_rate==null?'—':(D.win_rate*100).toFixed(0)+'%'), delta:'open positions green', cls:'muted'},
];
document.getElementById('kpis').innerHTML = kpis.map(k=>`
  <div class="card kpi">
    <div class="label">${k.label}</div>
    <div class="value ${k.cls}">${k.value}</div>
    <div class="delta ${k.cls}">${k.delta}</div>
  </div>`).join('');

// ---- Equity curve (inline SVG, Catmull-Rom smoothing) ----
function drawChart(){
  const W=1000,H=300,padL=8,padR=8,padT=18,padB=26;
  let pts = D.curve.map(p=>p.v);
  if(pts.length<2) pts = pts.length? [pts[0],pts[0]] : [D.start_equity,D.start_equity];
  const base = D.start_equity;
  let lo=Math.min(base,...pts), hi=Math.max(base,...pts);
  if(hi===lo){hi=lo+1;lo=lo-1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const x=i=>padL+(i/(pts.length-1))*(W-padL-padR);
  const y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
  const coords=pts.map((v,i)=>({x:x(i),y:y(v)}));
  // smooth path
  let d='M'+coords[0].x.toFixed(1)+','+coords[0].y.toFixed(1);
  for(let i=0;i<coords.length-1;i++){
    const p0=coords[i-1]||coords[i],p1=coords[i],p2=coords[i+1],p3=coords[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const area=d+` L${coords[coords.length-1].x.toFixed(1)},${(H-padB)} L${coords[0].x.toFixed(1)},${(H-padB)} Z`;
  const up = pts[pts.length-1] >= base;
  const stroke = up? 'var(--pos)':'var(--neg)';
  const baseY=y(base).toFixed(1);
  document.getElementById('chart').innerHTML=`
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Equity curve">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${up?'#22c55e':'#f43f5e'}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${up?'#22c55e':'#f43f5e'}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>
    <text class="axis" x="6" y="${(+baseY-6)}">baseline ${usd(base)}</text>
    <path d="${area}" fill="url(#fill)"/>
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
drawChart();
